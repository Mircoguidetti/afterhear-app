name: Recogniser stress test

# Recognisers on the device (free) and on servers (only with "paid"), on real English meetings in
# three conditions and on Spanish, French and German sentences (docs/BRAIN.md § 19.22). By hand only.

on:
  workflow_dispatch:
    inputs:
      paid:
        description: "Also Speechmatics (about 1 credit) on the same clips (ElevenLabs only with STRESS_ELEVENLABS)"
        type: boolean
        default: false
      only:
        description: "Only these recognisers, comma separated (e.g. elevenlabs); empty = all"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        condition: [clean, fast, noisy, languages]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper "onnx-asr[cpu,hub]" huggingface_hub requests
      - name: Audio cache
        uses: actions/cache@v4
        with:
          path: bench/out/audio
          key: stress-ami-v1
      - name: Transcribe and score
        env:
          ASAID_TESTER_CODE: ${{ inputs.paid && secrets.ASAID_TESTER_CODE || '' }}
          SPEECHMATICS_API_KEY: ${{ inputs.paid && secrets.SPEECHMATICS_API_KEY || '' }}
          STRESS_PAID: ${{ inputs.paid && '1' || '' }}
          STRESS_ONLY: ${{ inputs.only }}
          STRESS_ELEVENLABS: ${{ contains(inputs.only, 'elevenlabs') && '1' || '' }}
        run: python3 bench/stress.py clips ${{ matrix.condition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.condition }}
          path: |
            bench/out/stress/*.json
            bench/out/stress/${{ matrix.condition }}/*.wav

  table:
    needs: clips
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stress-*
          path: bench/out/stress
          merge-multiple: true
      - name: One table
        run: python3 bench/stress.py table
